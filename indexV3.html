<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shufflers</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d2233">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ====== PERSONALIZA AQUÍ ====== */
:root{
  --fondo:#1d2233;
  --fondo-imagen:none;              /* ej: url("mi-fondo.jpg") */
  --texto:#f4f5fa;
  --texto-suave:#aab0c6;
  --acento:#ffb84d;
  --panel:rgba(255,255,255,.08);
  --radio:14px;
  --fuente:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--fondo:#eef0f7;--texto:#1c2033;--texto-suave:#5b6280;--panel:rgba(0,0,0,.06)}
}
/* ================================ */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--fuente);color:var(--texto);background:var(--fondo) var(--fondo-imagen) center/cover fixed;overflow-x:hidden}
main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
section{width:100%;max-width:760px;text-align:center}
[hidden]{display:none!important}
h1{font-size:1.7rem;margin:0 0 6px}
p.sub{color:var(--texto-suave);margin:0 0 16px}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:12px 26px;background:var(--acento);color:#2a1d00;font-weight:700}
button.sec{background:var(--panel);color:var(--texto)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,.slot:focus-visible,input:focus-visible{outline:3px solid var(--acento);outline-offset:3px}
.fila{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
input[type=text]{font:inherit;width:100%;max-width:320px;padding:10px 14px;border-radius:999px;border:2px solid var(--panel);background:var(--panel);color:var(--texto);margin-bottom:14px;text-align:center}

/* Galería */
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:22px 18px;margin-top:20px}
.item{position:relative}
.item .pack{width:100%;margin:0}
.item .inf span{font-size:2rem}
.item .nombre{margin-top:10px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .estado{font-size:.85rem;color:var(--texto-suave)}
.item.abierto .pack{filter:grayscale(.85) brightness(.7)}
.del{position:absolute;top:-8px;right:-8px;padding:3px 9px;font-size:.8rem;background:rgba(0,0,0,.7);color:#fff;z-index:2}
.del.seguro{background:#d33}
.nuevo{aspect-ratio:11/16;width:100%;border-radius:var(--radio);background:var(--panel);color:var(--texto);border:2px dashed var(--texto-suave);display:grid;place-content:center;gap:4px;font-weight:600}
.nuevo span{font-size:2.6rem;line-height:1}

/* Crear */
.drop{display:block;border:2px dashed var(--texto-suave);border-radius:var(--radio);padding:20px;cursor:pointer;background:var(--panel)}
.drop:hover{border-color:var(--acento)}
.drop input{display:none}
.thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:16px}
.thumb{position:relative;aspect-ratio:5/7;border-radius:8px;overflow:hidden;background:var(--panel);outline:3px solid var(--r);outline-offset:-3px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;padding:0;font-size:.75rem}
.quitar{top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff}
.rar{bottom:4px;left:4px;padding:2px 7px!important;border-radius:6px!important;background:var(--r);color:#1b1b2b}

/* Sobre */
.pack{position:relative;width:min(220px,60vw);aspect-ratio:11/16;margin:10px auto;padding:0;background:none;border-radius:0;display:block;--h:260}
.parte{position:absolute;left:0;right:0;background:linear-gradient(145deg,hsl(var(--h) 90% 68%),hsl(calc(var(--h) + 70) 80% 58%) 55%,hsl(calc(var(--h) + 150) 90% 62%));box-shadow:0 14px 34px rgba(0,0,0,.4);transition:transform .7s ease,opacity .7s ease}
.sup{top:0;height:20%;border-radius:var(--radio) var(--radio) 0 0;clip-path:polygon(0 0,100% 0,100% 78%,92% 100%,84% 78%,76% 100%,68% 78%,60% 100%,52% 78%,44% 100%,36% 78%,28% 100%,20% 78%,12% 100%,4% 78%,0 100%)}
.inf{top:17%;bottom:0;border-radius:0 0 var(--radio) var(--radio);display:grid;place-items:center;overflow:hidden}
.inf::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);animation:brillo 3.2s ease-in-out infinite}
.inf span{font-size:3.2rem;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
@keyframes brillo{60%,100%{transform:translateX(120%)}}
.pack.conportada .inf{background:var(--portada) center/cover}
.pack.conportada .inf span{display:none}
.portada{margin-bottom:12px}
.prev img{height:96px;aspect-ratio:11/16;object-fit:cover;border-radius:8px;margin-top:10px}
.pack.sacude{animation:sacude .7s ease-in-out}
@keyframes sacude{0%,100%{transform:rotate(0)}15%{transform:translateX(-9px) rotate(-5deg)}30%{transform:translateX(9px) rotate(5deg)}45%{transform:translateX(-8px) rotate(-4deg)}60%{transform:translateX(8px) rotate(4deg)}80%{transform:translateX(-3px) rotate(-1deg)}}
.pack.abre .sup{transform:translateY(-170%) rotate(-14deg);opacity:0}
.pack.abre .inf{transform:scale(.85) translateY(30%);opacity:0}
.destello{position:fixed;inset:0;background:radial-gradient(circle,var(--fc,#fff),transparent 65%);opacity:0;pointer-events:none;z-index:5}
.destello.on{animation:flash .8s ease-out}
@keyframes flash{0%{opacity:0}30%{opacity:var(--fo,.9)}100%{opacity:0}}
.tiembla{animation:tiembla .5s linear}
@keyframes tiembla{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}

/* Revelar */
.cuenta{color:var(--texto-suave);margin-bottom:12px}
.escena{position:relative;width:min(280px,72vw);margin:0 auto;--r:#fff}
.rayos{position:absolute;left:50%;top:50%;width:230%;aspect-ratio:1;translate:-50% -50%;background:repeating-conic-gradient(var(--r) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000,transparent 62%);mask:radial-gradient(circle,#000,transparent 62%);opacity:0;animation:gira 14s linear infinite;pointer-events:none;transition:opacity .4s}
@keyframes gira{to{rotate:360deg}}
.escena[data-r="4"] .rayos{opacity:.25}
.escena[data-r="5"] .rayos{opacity:.6}
.slot{position:relative;width:100%;aspect-ratio:5/7;padding:0;background:none;border-radius:0;display:block}
.carta{position:absolute;inset:0;border-radius:var(--radio);border:5px solid var(--r,#fff);overflow:hidden;box-shadow:0 16px 38px rgba(0,0,0,.45);background:#222}
.carta img{width:100%;height:100%;object-fit:cover;display:block}
.carta.r4{box-shadow:0 0 26px var(--r),0 16px 38px rgba(0,0,0,.45)}
.carta.r5{box-shadow:0 0 44px var(--r),0 0 90px var(--r),0 16px 38px rgba(0,0,0,.45)}
.dorso{--r:#fff;background:repeating-linear-gradient(45deg,#4b3fd1 0 12px,#5d50ea 12px 24px);display:grid;place-items:center;font-size:3.4rem}
.carta.entra{animation:voltea .55s cubic-bezier(.2,.8,.3,1.2)}
.carta.entra.r5{animation:voltea .55s cubic-bezier(.2,.8,.3,1.2),latido 1.4s .6s ease-in-out infinite,arco 5s linear infinite}
@keyframes voltea{from{transform:rotateY(90deg) scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes latido{50%{box-shadow:0 0 70px var(--r),0 0 130px var(--r)}}
.carta.entra::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);animation:pasa .9s .2s ease-out both}
@keyframes pasa{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.estrellas{font-size:1.8rem;font-weight:800;margin-top:16px;min-height:2.2rem;letter-spacing:4px}
.pista{color:var(--texto-suave);min-height:1.4em}

/* Resumen */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.grid .carta{position:relative;aspect-ratio:5/7;border-width:3px;opacity:0;animation:aparece .4s ease-out forwards}
.etq{position:absolute;bottom:4px;left:0;right:0;font-size:.8rem;color:var(--r);text-shadow:0 1px 3px #000}
@keyframes aparece{from{transform:translateY(14px) scale(.9);opacity:0}to{transform:none;opacity:1}}
/* Arcoíris del SSR */
@property --r{syntax:"<color>";inherits:true;initial-value:#fff}
@keyframes arco{0%,100%{--r:#ff4d4d}17%{--r:#ffb84d}33%{--r:#f2e64d}50%{--r:#4dff88}67%{--r:#4dc3ff}83%{--r:#c04dff}}
.escena[data-r="5"]{animation:arco 5s linear infinite}
.estrellas.r5{color:var(--r);animation:arco 5s linear infinite}
.grid .carta.r5{animation:aparece .4s ease-out forwards,arco 5s linear infinite}
.thumb.r5 .rar{background:linear-gradient(90deg,#ff4d4d,#ffb84d,#f2e64d,#4dff88,#4dc3ff,#c04dff)}
@media (max-width:520px){.grid{grid-template-columns:repeat(3,1fr)}.thumbs{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main>
  <section id="galeria">
    <h1>Mis sobres</h1>
    <p class="sub">Elige un sobre para abrirlo o crea uno nuevo.</p>
    <div class="galeria" id="lista"></div>
  </section>

  <section id="crear" hidden>
    <h1>Nuevo sobre</h1>
    <input type="text" id="nombre" maxlength="30" placeholder="Nombre del sobre" aria-label="Nombre del sobre">
    <label class="drop portada">
      <input id="portadaArchivo" type="file" accept="image/*">
      <strong>Portada del sobre (opcional)</strong><div class="prev" id="prev"></div>
    </label>
    <div class="fila" style="margin:-4px 0 12px"><button class="sec" id="quitarPortada" hidden>Quitar portada</button></div>
    <label class="drop">
      <input id="archivos" type="file" accept="image/*" multiple>
      <strong>Elegir imágenes</strong><br><span class="sub" id="contador"></span>
    </label>
    <p class="sub" style="margin-top:12px">Toca la etiqueta de cada carta (R, SR, SSR) para cambiar su rareza.</p>
    <div class="thumbs" id="miniaturas"></div>
    <div class="fila">
      <button id="guardar" disabled>Crear sobre</button>
      <button class="sec" id="cancelar">Cancelar</button>
    </div>
  </section>

  <section id="sobre" hidden>
    <h1 id="titulo"></h1>
    <p class="sub">Tócalo para abrirlo.</p>
    <button class="pack" id="pack" aria-label="Abrir sobre">
      <div class="parte inf"><span>★</span></div>
      <div class="parte sup"></div>
    </button>
    <div class="fila"><button class="sec" id="atras">Volver a la galería</button></div>
  </section>

  <section id="revelar" hidden>
    <div class="cuenta" id="cuenta"></div>
    <div class="escena" id="escena"><div class="rayos"></div><button class="slot" id="slot" aria-live="polite"></button></div>
    <div class="estrellas" id="estrellas"></div>
    <div class="pista" id="pista"></div>
    <div class="fila"><button class="sec" id="saltar">Saltar al resumen</button></div>
  </section>

  <section id="resumen" hidden>
    <h1 id="rtitulo"></h1>
    <div class="grid" id="grid"></div>
    <div class="fila">
      <button id="volver">Volver a la galería</button>
      <button class="sec" id="otra">Abrir de nuevo</button>
    </div>
  </section>
</main>
<div class="destello" id="destello"></div>

<script>
const MIN = 1, MAX = 12;                       // cartas por sobre
const R = {3:"#c0c8d4", 4:"#ffc83d", 5:"#ff5ec4"}; // color por rareza: R plateado, SR dorado, SSR (arcoíris animado)
const NOM = {3:"R", 4:"SR", 5:"SSR"};                // nombres que se muestran
const fcol = r => r === 5 ? "#ffffff" : R[r];       // color del destello
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let sobres = [], borrador = [], portada = null, actual = null, mazo = [], pos = 0, db = null;

function ver(id){ ["galeria","crear","sobre","revelar","resumen"].forEach(s => $(s).hidden = s !== id); }

/* ---- Guardado en el navegador (IndexedDB) ---- */
const abrirDB = () => new Promise(ok => {
  try{
    const r = indexedDB.open("shufflers", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("sobres", {keyPath:"id"});
    r.onsuccess = () => { db = r.result; ok(); };
    r.onerror = () => ok();
  }catch(e){ ok(); }
});
const persistir = s => new Promise(ok => {
  if(!db) return ok();
  try{
    const t = db.transaction("sobres","readwrite");
    t.objectStore("sobres").put({id:s.id, nombre:s.nombre, hue:s.hue, abierto:s.abierto, portada:s.portada || null,
      cartas:s.cartas.map(({blob,nombre,rareza}) => ({blob,nombre,rareza}))});
    t.oncomplete = t.onerror = () => ok();
  }catch(e){ ok(); }
});
const borrarDB = id => { try{ db && db.transaction("sobres","readwrite").objectStore("sobres").delete(id); }catch(e){} };
const cargar = () => new Promise(ok => {
  if(!db) return ok([]);
  try{
    const q = db.transaction("sobres").objectStore("sobres").getAll();
    q.onsuccess = () => ok(q.result); q.onerror = () => ok([]);
  }catch(e){ ok([]); }
});

/* ---- Galería ---- */
function galeria(){
  const l = $("lista");
  l.innerHTML = '<button class="nuevo" id="nuevo"><span>+</span>Nuevo sobre</button>';
  $("nuevo").onclick = nuevo;
  sobres.forEach(s => {
    const d = document.createElement("div");
    d.className = "item" + (s.abierto ? " abierto" : "");
    d.innerHTML = `<button class="pack${s.portadaUrl ? " conportada" : ""}" style="--h:${s.hue}${s.portadaUrl ? `;--portada:url('${s.portadaUrl}')` : ""}" aria-label="${esc(s.nombre)}"><div class="parte inf"><span>★</span></div><div class="parte sup"></div></button>
      <div class="nombre">${esc(s.nombre)}</div><div class="estado">${s.abierto ? "✓ Abierto" : s.cartas.length + " cartas"}</div>
      <button class="del" aria-label="Eliminar sobre">×</button>`;
    d.querySelector(".pack").onclick = () => abrir(s);
    const del = d.querySelector(".del");
    del.onclick = () => {
      if(!del.classList.contains("seguro")){
        del.classList.add("seguro"); del.textContent = "¿Eliminar?";
        setTimeout(() => { del.classList.remove("seguro"); del.textContent = "×"; }, 2500);
        return;
      }
      s.cartas.forEach(c => URL.revokeObjectURL(c.url)); if(s.portadaUrl) URL.revokeObjectURL(s.portadaUrl);
      sobres = sobres.filter(x => x !== s); borrarDB(s.id); galeria();
    };
    l.appendChild(d);
  });
  ver("galeria");
}

/* ---- Crear sobre ---- */
function nuevo(){ borrador = []; portada = null; $("nombre").value = ""; pintar(); pintarPortada(); ver("crear"); }

function pintarPortada(){
  $("prev").innerHTML = portada ? `<img src="${portada.url}" alt="Portada">` : "";
  $("quitarPortada").hidden = !portada;
}
$("portadaArchivo").addEventListener("change", e => {
  const f = e.target.files[0];
  if(f && f.type.startsWith("image/")){
    if(portada) URL.revokeObjectURL(portada.url);
    portada = {blob:f, url:URL.createObjectURL(f)};
    pintarPortada();
  }
  e.target.value = "";
});
$("quitarPortada").onclick = () => { if(portada) URL.revokeObjectURL(portada.url); portada = null; pintarPortada(); };

$("archivos").addEventListener("change", e => {
  for(const f of e.target.files){
    if(borrador.length >= MAX) break;
    if(f.type.startsWith("image/")) borrador.push({blob:f, nombre:f.name, rareza:3, url:URL.createObjectURL(f)});
  }
  e.target.value = ""; pintar();
});

function pintar(){
  const c = $("miniaturas"); c.innerHTML = "";
  borrador.forEach((x, i) => {
    const d = document.createElement("div");
    d.className = "thumb r" + x.rareza; d.style.setProperty("--r", R[x.rareza]);
    d.innerHTML = `<img src="${x.url}" alt="${esc(x.nombre)}"><button class="quitar" aria-label="Quitar carta">×</button><button class="rar" aria-label="Cambiar rareza">${NOM[x.rareza]}</button>`;
    d.querySelector(".quitar").onclick = () => { URL.revokeObjectURL(x.url); borrador.splice(i,1); pintar(); };
    d.querySelector(".rar").onclick = () => { x.rareza = x.rareza === 5 ? 3 : x.rareza + 1; pintar(); };
    c.appendChild(d);
  });
  $("contador").textContent = `${borrador.length} de ${MAX} cartas`;
  $("guardar").disabled = borrador.length < MIN;
}

$("guardar").onclick = async () => {
  const s = {id:Date.now(), nombre:$("nombre").value.trim() || `Sobre ${sobres.length + 1}`,
    hue:Math.floor(Math.random()*360), abierto:false, cartas:borrador,
    portada:portada ? portada.blob : null, portadaUrl:portada ? portada.url : null};
  sobres.push(s); borrador = []; portada = null; await persistir(s); galeria();
};
$("cancelar").onclick = () => { borrador.forEach(x => URL.revokeObjectURL(x.url)); borrador = []; if(portada) URL.revokeObjectURL(portada.url); portada = null; galeria(); };
$("atras").onclick = $("volver").onclick = galeria;

/* ---- Abrir sobre ---- */
function barajar(a){
  a = a.slice();
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function abrir(s){ actual = s; if(s.abierto){ mazo = s.cartas; resumen(false); } else preparar(); }
function preparar(){
  mazo = barajar(actual.cartas); pos = 0;
  const p = $("pack"); p.className = "pack" + (actual.portadaUrl ? " conportada" : ""); p.style.setProperty("--h", actual.hue);
  if(actual.portadaUrl) p.style.setProperty("--portada", `url("${actual.portadaUrl}")`);
  p.disabled = false;
  $("titulo").textContent = actual.nombre; ver("sobre");
}
$("otra").onclick = preparar;

function flash(o, col){
  const d = $("destello"); d.style.setProperty("--fc", col); d.style.setProperty("--fo", o);
  d.classList.remove("on"); void d.offsetWidth; d.classList.add("on");
}

$("pack").onclick = () => {
  const p = $("pack"); p.disabled = true; p.classList.add("sacude");
  const mejor = Math.max(...actual.cartas.map(c => c.rareza));
  setTimeout(() => { p.classList.remove("sacude"); p.classList.add("abre"); flash(mejor >= 5 ? 1 : .7, fcol(mejor)); }, 750);
  setTimeout(iniciar, 1500);
};

/* ---- Revelar una a una ---- */
function iniciar(){
  pos = 0; $("escena").dataset.r = "";
  $("slot").innerHTML = '<div class="carta dorso">★</div>';
  $("cuenta").textContent = `0 / ${mazo.length}`;
  $("estrellas").textContent = "";
  $("pista").textContent = "Toca la carta para revelarla";
  ver("revelar");
}
$("slot").onclick = () => {
  if(pos >= mazo.length) return resumen(true);
  const c = mazo[pos++], col = R[c.rareza], e = $("escena");
  e.style.setProperty("--r", col); e.dataset.r = c.rareza;
  $("slot").innerHTML = `<div class="carta entra r${c.rareza}" style="--r:${col}"><img src="${c.url}" alt="${esc(c.nombre)}"></div>`;
  $("estrellas").textContent = NOM[c.rareza]; $("estrellas").className = "estrellas r" + c.rareza; $("estrellas").style.color = c.rareza === 5 ? "" : col;
  $("cuenta").textContent = `${pos} / ${mazo.length}`;
  $("pista").textContent = pos < mazo.length ? "Toca para la siguiente carta" : "Toca para ver el resumen";
  if(c.rareza >= 4) flash(c.rareza === 5 ? .9 : .45, fcol(c.rareza));
  if(c.rareza === 5){ const m = document.querySelector("main"); m.classList.remove("tiembla"); void m.offsetWidth; m.classList.add("tiembla"); }
};
$("saltar").onclick = () => resumen(true);

/* ---- Resumen ---- */
function resumen(marcar){
  $("rtitulo").textContent = actual.nombre;
  const g = $("grid"); g.innerHTML = "";
  mazo.forEach((c, i) => {
    const d = document.createElement("div");
    d.className = `carta r${c.rareza}`;
    d.style.cssText = `--r:${R[c.rareza]};animation-delay:${i*60}ms`;
    d.innerHTML = `<img src="${c.url}" alt="${esc(c.nombre)}"><span class="etq">${NOM[c.rareza]}</span>`;
    g.appendChild(d);
  });
  ver("resumen");
  if(marcar && !actual.abierto){ actual.abierto = true; persistir(actual); }
}

/* ---- Inicio ---- */
(async () => {
  await abrirDB();
  const g = await cargar();
  sobres = g.sort((a,b) => a.id - b.id).map(s => ({...s, portadaUrl:s.portada ? URL.createObjectURL(s.portada) : null, cartas:s.cartas.map(c => ({...c, url:URL.createObjectURL(c.blob)}))}));
  galeria();
})();

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
